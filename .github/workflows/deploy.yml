# Publikuje folder public/ na GitHub Pages po każdym wypchnięciu (push) na gałąź main.
# Domena aftermath.pl wskazuje na GitHub Pages (rekordy DNS w cyber_Folks).
name: Publikacja aftermath.pl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v5

      - name: Przygotuj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Spakuj folder public
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
