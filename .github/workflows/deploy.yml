# Publikuje folder public/ na serwer cyber_Folks po każdym wypchnięciu (push) na gałąź main.
name: Publikacja aftermath.pl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v5

      - name: Zainstaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wyślij pliki na serwer (szyfrowane FTP)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set ftp:fix-pasv-address true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 1;
            set net:timeout 20;
            mirror --reverse --delete --verbose --exclude-glob .well-known/ public/ ./;
            bye"
