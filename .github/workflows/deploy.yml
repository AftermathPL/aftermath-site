# Publikuje folder public/ na serwer cyber_Folks po każdym wypchnięciu (push) na gałąź main.
name: Publikacja aftermath.pl

on:
  push:
    branches: [main]
  workflow_dispatch:   # przycisk "Run workflow" do ręcznego uruchomienia

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Wyślij pliki na serwer przez szyfrowane FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./
